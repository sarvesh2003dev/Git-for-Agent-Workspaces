[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workspace-checkpoints"
version = "0.2.0"
description = "Verified filesystem checkpoints around agent commands"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sarvesh Tamse"}]
dependencies = []

[project.urls]
Repository = "https://github.com/sarvesh2003dev/Git-for-Agent-Workspaces"

[project.scripts]
workspace-checkpoint = "workspace_cli:main"

[tool.setuptools]
py-modules = ["snapshot_daemon", "workspace_cli", "benchmark", "demo", "watcher", "init_workspace"]
